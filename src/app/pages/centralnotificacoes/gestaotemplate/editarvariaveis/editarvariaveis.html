<div class="br-card">
    <div class="card-header">
        <div class="d-flex justify-content-between align-items-center">
            <h3 class="title">Variáveis do Template</h3>

            <button class="br-button primary small" type="button" (click)="adicionarLinha()">
                <i class="fas fa-plus mr-2"></i> Incluir
            </button>
        </div>
    </div>

    <div class="card-content">

        <div class="br-table">
            <table>
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Variável</th>
                        <th>Tipo</th>
                        <th></th>
                        <th style="width: 80px;">Ações</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let item of variaveis; let i = index">

                        <!-- DESCRIÇÃO -->
                        <td>
                            <br-input density="medium" [value]="item.descricao"></br-input>
                        </td>

                        <!-- VARIÁVEL -->
                        <td>
                            <br-input density="medium" [value]="item.variavel"></br-input>
                        </td>

                        <!-- TIPO -->
                        <td>
                            <br-select placeholder="Selecione uma opção" [options]="tiposDisponiveis.map(t => ({
                                label: t.label,
                                value: t.value,
                                selected: t.value === item.tipo
                            }))">
                            </br-select>
                        </td>
                        
                        <td>
                            <br-switch has-icon>Obrigatória?</br-switch>
                        </td>

                        <!-- AÇÕES -->
                        <td class="text-center">
                            <button class="br-button circle danger small" type="button" title="Excluir"
                                (click)="removerLinha(i)">

                                <i class="fas fa-trash"></i>
                            </button>
                        </td>

                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
