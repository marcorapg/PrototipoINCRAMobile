<div class="br-card">
    <div class="card-header">
        <div class="d-flex justify-content-between align-items-center">
            <h3 class="title">Documentos Anexos</h3>

            <button class="br-button primary small" type="button" (click)="adicionarLinha()">
                <i class="fas fa-plus mr-2"></i> Incluir Documento
            </button>
        </div>
    </div>

    <div class="card-content">

        <div *ngFor="let item of documentos; let i = index">

            <!-- DESCRIÇÃO -->
            <div class="row">
                <div class="col-6">
                    <br-input label="ID do documento" density="medium" [value]="item.id"></br-input>
                </div>
                <div class="col-5">
                    <br-input label="Nome do arquivo" density="medium" [value]="item.nome"></br-input>
                </div>
                <div class="col-1">
                    <button class="br-button circle danger small mt-4" type="button" title="Excluir"
                        (click)="removerLinha(i)">

                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <label>Template do documento</label>
                    <quill-editor [(ngModel)]="item.corpo" theme="snow" class="editor-full"
                        [ngModelOptions]="{standalone: true}">
                    </quill-editor>
                </div>
            </div>
            <br-divider *ngIf="documentos.length > 1 && i < documentos.length - 1">
            </br-divider>
        </div>
    </div>
</div>
