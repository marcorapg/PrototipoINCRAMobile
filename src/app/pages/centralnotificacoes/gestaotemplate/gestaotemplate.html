<app-breadcrumb [items]="[
    { label: 'Página inicial', url: '/' },
    { label: 'Central de Notificações', url: '/centralnotificacoes/' },
    { label: 'Gestão de Templates', url: '/centralnotificacoes/gestaotemplate' }
  ]">
</app-breadcrumb>

<h1>Gestão de Templates</h1>

<!-- Filtros -->
<div class="row mt-3">
    <div class="col-12">
        <div class="br-card">
            <div class="card-header">
                <div class="ml-3">
                    <div class="text-weight-semi-bold text-up-02">Filtros</div>
                </div>
            </div>
            <div class="card-content">
                <div class="row mt-3 mb-3">
                    <div class="col-2">
                        <br-input label="ID do template" density="medium"></br-input>
                    </div>                    
                    <div class="col-2">
                        <br-input label="Nome" density="medium"></br-input>
                    </div>
                    <div class="col-2">
                        <br-select label="Tipo de Template" placeholder="Selecione uma opção" options='[
                        { "label": "Simples", "value": "1", "selected": false },
                        { "label": "Ciência", "value": "2", "selected": false },
                        { "label": "Assinatura", "value": "3", "selected": false }
                        ]'></br-select>
                    </div>
                    <div class="col-2">
                        <br-select label="Serviço" placeholder="Selecione uma opção" options='[
                        { "label": "Todos", "value": "6", "selected": false },
                        { "label": "PGT Cobrança", "value": "1", "selected": false },
                        { "label": "PGT Reforma Agrária", "value": "2", "selected": false },
                        { "label": "PGT Regularização Fundiária Urbana", "value": "2", "selected": false },
                        { "label": "PGT Regularização Fundiária Rural", "value": "2", "selected": false }
                        ]'></br-select>
                    </div>
                    <div class="col-1">
                        <br-select label="Status" placeholder="Selecione uma opção" options='[
                        { "label": "Ativo", "value": "1", "selected": false },
                        { "label": "Inativo", "value": "2", "selected": false }
                        ]'></br-select>
                    </div>

                    <div class="col-3 mt-4 d-flex justify-content-end">
                        <div>
                            <br-button emphasis="secondary">
                                <i class="fas fa-eraser mr-3" aria-hidden="true"></i>
                                Limpar
                            </br-button>
                        </div>
                        <div class="ml-3">
                            <br-button emphasis="primary">
                                <i class="fas fas fa-search mr-3" aria-hidden="true"></i>
                                Buscar
                            </br-button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Grid Templates -->
<div class="br-table">
    <div class="table-header">
        <div class="top-bar">
            <div class="table-title">Templates</div>
            <div class="ml-3"><br-button emphasis="primary"><i class="fas fa-plus mr-3" aria-hidden="true"></i>Novo
                    Template</br-button></div>
        </div>
    </div>
    <table>
        <caption>Templates</caption>
        <thead>
            <tr>
                <th scope="col">ID do template</th>
                <th scope="col">Nome</th>
                <th scope="col">Tipo</th>
                <th scope="col">Serviço</th>
                <th scope="col">Status</th>
                <th scope="col">Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let template of templates; let i = index">
                <td data-th="Título coluna 1">{{template.id}}</td>
                <td data-th="Título coluna 1">{{template.nome}}</td>
                <td data-th="Título coluna 3"><br-tag [attr.bg-color]="getTipoColor(template.tipo)"
                        [attr.label]="template.tipo" shape="rounded" title="Tipo da template">
                    </br-tag></td>
                <td data-th="Título coluna 4">{{template.sistema}}</td>
                <td data-th="Título coluna 4"><br-tag [attr.bg-color]="getStatusColor(template.status)"
                        [attr.label]="template.status" shape="rounded" title="Status do template">
                    </br-tag>
                </td>
                <td data-th="Título coluna 5">
                    <button class="br-button circle small" type="button" title="Editar"
                        [routerLink]="['/centralnotificacoes/gestaotemplate/editartemplate']">
                        <i class="fas fa-pen"></i>
                    </button>
                    <button class="br-button circle small" type="button" title="Excluir" (click)="abrirScrim()">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
    <div class="table-footer">
        <nav class="br-pagination" aria-label="paginação" data-total="50" data-current="1" data-per-page="20">
            <div class="pagination-per-page">
                <div class="br-select">
                    <div class="br-input">
                        <label for="per-page-selection-random-64610">Exibir</label>
                        <input id="per-page-selection-random-64610" type="text" placeholder=" " />
                        <button class="br-button" type="button" aria-label="Exibir lista" tabindex="-1"
                            data-trigger="data-trigger"><i class="fas fa-angle-down" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="br-list" tabindex="0">
                        <div class="br-item" tabindex="-1">
                            <div class="br-radio">
                                <input id="per-page-10-random-64610" type="radio" name="per-page-random-64610"
                                    value="per-page-10-random-64610" checked="checked" />
                                <label for="per-page-10-random-64610">10</label>
                            </div>
                        </div>
                        <div class="br-item" tabindex="-1">
                            <div class="br-radio">
                                <input id="per-page-20-random-64610" type="radio" name="per-page-random-64610"
                                    value="per-page-20-random-64610" />
                                <label for="per-page-20-random-64610">20</label>
                            </div>
                        </div>
                        <div class="br-item" tabindex="-1">
                            <div class="br-radio">
                                <input id="per-page-30-random-64610" type="radio" name="per-page-random-64610"
                                    value="per-page-30-random-64610" />
                                <label for="per-page-30-random-64610">30</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div><span class="br-divider d-none d-sm-block mx-3"></span>
            <div class="pagination-information d-none d-sm-flex"><span class="current">1</span>&ndash;<span
                    class="per-page">20</span>&nbsp;de&nbsp;<span class="total">50</span>&nbsp;itens</div>
            <div class="pagination-go-to-page d-none d-sm-flex ml-auto">
                <div class="br-select">
                    <div class="br-input">
                        <label for="go-to-selection-random-43734">Página</label>
                        <input id="go-to-selection-random-43734" type="text" placeholder=" " />
                        <button class="br-button" type="button" aria-label="Exibir lista" tabindex="-1"
                            data-trigger="data-trigger"><i class="fas fa-angle-down" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="br-list" tabindex="0">
                        <div class="br-item" tabindex="-1">
                            <div class="br-radio">
                                <input id="go-to-1-random-43734" type="radio" name="go-to-random-43734"
                                    value="go-to-1-random-43734" checked="checked" />
                                <label for="go-to-1-random-43734">1</label>
                            </div>
                        </div>
                        <div class="br-item" tabindex="-1">
                            <div class="br-radio">
                                <input id="go-to-2-random-43734" type="radio" name="go-to-random-43734"
                                    value="go-to-2-random-43734" />
                                <label for="go-to-2-random-43734">2</label>
                            </div>
                        </div>
                        <div class="br-item" tabindex="-1">
                            <div class="br-radio">
                                <input id="go-to-3-random-43734" type="radio" name="go-to-random-43734"
                                    value="go-to-3-random-43734" />
                                <label for="go-to-3-random-43734">3</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div><span class="br-divider d-none d-sm-block mx-3"></span>
            <div class="pagination-arrows ml-auto ml-sm-0">
                <button class="br-button circle" type="button" aria-label="Voltar página"><i class="fas fa-angle-left"
                        aria-hidden="true"></i>
                </button>
                <button class="br-button circle" type="button" aria-label="Página seguinte"><i
                        class="fas fa-angle-right" aria-hidden="true"></i>
                </button>
            </div>
        </nav>
    </div>
</div>

<br-scrim id="scrimExcluir" scroll-strategy="block" position-content="center">
    <div class="br-modal">
        <!-- Cabeçalho -->
        <div class="br-modal-header modal-header-fix">

            <div class="modal-header-left">
                <i class="fas fa-triangle-exclamation mr-2"></i>
                <span class="br-modal-title">Confirmar exclusão</span>
            </div>

            <button class="br-button circle small" type="button" aria-label="Fechar"
                onclick="document.querySelector('#scrimExcluir').close()">
                <i class="fas fa-times"></i>
            </button>

        </div>

        <!-- Corpo -->
        <div class="br-modal-body">
            <p>
                Tem certeza que deseja excluir este template?
            </p>
        </div>

        <!-- Rodapé -->
        <div class="br-modal-footer d-flex justify-content-end">
            <br-button id="closeScrim" emphasis="secondary" onclick="document.querySelector('#scrimExcluir').close()">
                Cancelar
            </br-button>

            <br-button id="saveScrim" emphasis="primary" onclick="document.querySelector('#scrimExcluir').close()">
                <i class="fas fa-trash mr-2"></i>
                Salvar
            </br-button>
        </div>
    </div>
</br-scrim>
