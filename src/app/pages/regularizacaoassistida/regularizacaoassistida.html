<app-pageheader title="Regularização Assistida" backLink="/"></app-pageheader>

<div class="regularizacao-page">
    <!-- Card principal -->
    <div class="br-card card-apresentacao">
        <div class="card-content">
            <h1 class="titulo">Regularização Assistida</h1>

            <p class="descricao">
                Solicite sua regularização fundiária de forma simples e segura.
                Nossa equipe irá acompanhar seu processo e auxiliar durante todas as etapas.
            </p>

            <div class="vantagens">
                <div class="vantagem-item">
                    <i class="fas fa-check-circle"></i>
                    <span>Acompanhamento da solicitação</span>
                </div>

                <div class="vantagem-item">
                    <i class="fas fa-check-circle"></i>
                    <span>Envio digital de documentos</span>
                </div>

                <div class="vantagem-item">
                    <i class="fas fa-check-circle"></i>
                    <span>Mais rapidez e transparência</span>
                </div>
            </div>

            <a class="br-button primary btn-iniciar" [routerLink]="['/regularizacaoassistida/solicitarregularizacao']">
                Iniciar Regularização Assistida
            </a>
        </div>
    </div>
</div>
