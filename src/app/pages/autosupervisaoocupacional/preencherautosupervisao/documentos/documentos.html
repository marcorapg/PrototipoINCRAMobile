<app-pageheader title="Documentos" backLink="/autosupervisaoocupacional/preencherautosupervisao"></app-pageheader>

<div class="documentos-page">

    <!-- HEADER -->
    <div class="documentos-header">

        <h1 class="documentos-title">
            Documentos
        </h1>

        <p class="documentos-description">
            Informe os documentos comprobatórios e capture ao menos uma foto
            para identificação.
        </p>

    </div>

    <!-- CARD FORM -->
    <div class="br-card documentos-card">

        <div class="documentos-card-content">

            <h2 class="documentos-card-title">
                Dados dos documentos
            </h2>

            <!-- SELECT -->
            <div class="documentos-field-group">

                <label class="documentos-field-label" for="tipoDocumento">
                    Tipo de documento
                </label>

                <br-select [options]="tipoDocumentoOptions" id="tipoDocumento" placeholder="Selecione tipo"
                    (valueChange)="onTipoDocumentoChange($event)">
                </br-select>

            </div>

            <!-- DESCRIÇÃO -->
            <div class="documentos-field-group">

                <label class="documentos-field-label" for="descricaoDocumento">
                    Descrição
                </label>

                <textarea id="descricaoDocumento" class="documentos-textarea" rows="3"
                    placeholder="Descreva o documento" [(ngModel)]="descricao">
        </textarea>

            </div>

            <!-- FOTO -->
            <button class="br-button secondary documentos-capture-button" type="button">
                <i class="fas fa-camera"></i>

                Capturar Documento
            </button>

            <!-- SALVAR -->
            <button class="br-button primary documentos-save-button" type="button" [disabled]="!formularioValido"
                (click)="salvarItem()">
                Salvar
            </button>

        </div>

    </div>

    <!-- LISTA -->
    <div class="documentos-lista-container" *ngIf="itensDocumentos.length > 0">

        <div class="br-card documentos-lista-card" *ngFor="let item of itensDocumentos; let i = index">

            <div class="documentos-lista-content">

                <!-- THUMB -->
                <img src="assets/images/foto-documento.png" alt="Documento" class="documentos-thumbnail" />

                <!-- INFO -->
                <div class="documentos-lista-info">

                    <div class="documentos-lista-header">

                        <div class="documentos-lista-titulo">
                            {{ item.tipo }}
                        </div>

                        <!-- EXCLUIR -->
                        <button class="br-button circle small secondary documentos-delete-button" type="button"
                            (click)="removerItem(i)">
                            <i class="fas fa-trash"></i>
                        </button>

                    </div>

                    <div class="documentos-lista-texto">
                        {{ item.descricao }}
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- FOOTER -->
    <div class="documentos-footer-actions">

        <button class="br-button secondary documentos-footer-button" type="button" [routerLink]="['/autosupervisaoocupacional/preencherautosupervisao']">
            Voltar
        </button>

    </div>

</div>
