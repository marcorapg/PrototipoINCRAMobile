<app-pageheader title="Benfeitorias" backLink="/autosupervisaoocupacional/preencherautosupervisao"></app-pageheader>

<div class="benfeitorias-page">

    <!-- HEADER -->
    <div class="benfeitorias-header">

        <h1 class="benfeitorias-title">
            Benfeitorias
        </h1>

        <p class="benfeitorias-description">
            Informe os dados das benfeitorias existentes no lote e capture
            ao menos uma foto para identificação.
        </p>

    </div>

    <!-- CARD FORM -->
    <div class="br-card benfeitorias-card">

        <div class="benfeitorias-card-content">

            <h2 class="benfeitorias-card-title">
                Dados das benfeitorias
            </h2>

            <!-- SELECT -->
            <div class="benfeitorias-field-group">

                <label class="benfeitorias-field-label" for="tipoBenfeitoria">
                    Tipo de benfeitoria
                </label>

                <br-select [options]="tipoBenfeitoriaOptions" id="tipoBenfeitoria" placeholder="Selecione tipo"
                    (valueChange)="onTipoBenfeitoriaChange($event)">
                </br-select>

            </div>

            <!-- DESCRIÇÃO -->
            <div class="benfeitorias-field-group">

                <label class="benfeitorias-field-label" for="descricaoBenfeitoria">
                    Descrição
                </label>

                <textarea id="descricaoBenfeitoria" class="benfeitorias-textarea" rows="3"
                    placeholder="Descreva a benfeitoria" [(ngModel)]="descricao">
        </textarea>

            </div>

            <!-- FOTO -->
            <button class="br-button secondary benfeitorias-capture-button" type="button">
                <i class="fas fa-camera"></i>

                Capturar Foto
            </button>

            <!-- SALVAR -->
            <button class="br-button primary benfeitorias-save-button" type="button" [disabled]="!formularioValido"
                (click)="salvarItem()">
                Salvar
            </button>

        </div>

    </div>

    <!-- LISTA -->
    <div class="benfeitorias-lista-container" *ngIf="itensBenfeitorias.length > 0">

        <div class="br-card benfeitorias-lista-card" *ngFor="let item of itensBenfeitorias; let i = index">

            <div class="benfeitorias-lista-content">

                <!-- THUMB -->
                <img src="assets/images/galpao.png" alt="Benfeitoria" class="benfeitorias-thumbnail" />

                <!-- INFO -->
                <div class="benfeitorias-lista-info">

                    <div class="benfeitorias-lista-header">

                        <div class="benfeitorias-lista-titulo">
                            {{ item.tipo }}
                        </div>

                        <!-- EXCLUIR -->
                        <button class="br-button circle small secondary benfeitorias-delete-button" type="button"
                            (click)="removerItem(i)">
                            <i class="fas fa-trash"></i>
                        </button>

                    </div>

                    <div class="benfeitorias-lista-texto">
                        {{ item.descricao }}
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- FOOTER -->
    <div class="benfeitorias-footer-actions">

        <button class="br-button secondary benfeitorias-footer-button" type="button" [routerLink]="['/autosupervisaoocupacional/preencherautosupervisao']">
            Voltar
        </button>

    </div>

</div>
