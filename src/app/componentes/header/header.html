<br-header is-sticky>
    <br-header-logo slot="logo" src="https://www.gov.br/governodigital/pt-br/estrategias-e-governanca-digital/rede-nacional-de-governo-digital/10passos/biblioteca/logo-govbr.png/@@images/image"></br-header-logo>
    <span slot="signature">Assinatura</span>
    <br-button slot="search-icon" shape="circle" density="small" emphasis="tertiary" aria-label="Abrir busca">
        <br-icon icon-name="fa7-solid:search"></br-icon>
    </br-button>
    <br-input slot="search" id="highlight" placeholder="O que você procura?" is-highlight action-label="Buscar">
        <br-icon slot="action" icon-name="fa-solid:search" aria-hidden="true"></br-icon>
    </br-input>
    <br-sign-in slot="access" density="small">
        <br-icon slot="icon" icon-name="fa6-solid:user"></br-icon>
        Entrar
    </br-sign-in>
    <br-button slot="menu-trigger" shape="circle" density="small" emphasis="tertiary" aria-label="Abrir menu">
        <br-icon icon-name="fa7-solid:align-justify"></br-icon>
    </br-button>
    <span slot="caption">PGT - Aop Cidadão</span>
    <span slot="subcaption">INCRA</span>
</br-header>
